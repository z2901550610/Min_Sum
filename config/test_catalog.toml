# Canonical test commands and owners. Make variables in commands are expanded by Make.
schema_version = 1

[[tests]]
name = "test"
prerequisites = "test-unit test-integration"

[[tests]]
name = "test-unit"
prerequisites = "test-kem-unit $(DECODER_UNIT_TARGETS)"
[[tests.owners]]
exact = ["rtl/ram_bram.sv"]
covers_profiles = ["decoder"]

[[tests]]
name = "test-reset-sync"
groups = ["DECODER_UNIT_TARGETS"]
commands = [
  "@$(VERILATOR) $(VERILATOR_FLAGS) --top-module tb_reset_sync rtl/reset_sync.sv tb/tb_reset_sync.sv",
  "@$(SIM) $(VERILATOR_MDIR)/Vtb_reset_sync +verilator+quiet",
]
[[tests.owners]]
exact = ["rtl/reset_sync.sv", "tb/tb_reset_sync.sv"]
covers_profiles = ["decoder"]

