[[manual_rules]]
suffixes = [".tcl"]
requirement = "Dry-run the affected Vivado Tcl target."

[[manual_rules]]
exact = ["Makefile", "scripts/eda-env.sh"]
requirement = "Run affected production targets if their recipes/environment changed; use make check when qualifying a new toolchain baseline. Workflow smoke alone is not production RTL evidence."
