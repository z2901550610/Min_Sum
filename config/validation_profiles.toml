schema_version = 5
profile_order = [
  "records",
  "tool_entry",
  "workflow",
  "workflow_core",
  "local_rtl",
  "decoder",
  "public_params",
  "kem",
  "formal",
  "physical",
]

[profiles.records]
description = "Documentation, experiment records, or Vivado manifests"
targets = []
manual_requirements = []
covers = []

[profiles.tool_entry]
description = "Tool lock, filelist, waiver, Make, or Tcl entrypoint"
targets = ["check-filelists"]
manual_requirements = []
covers = []

[profiles.workflow]
description = "Workflow helper scripts and CI configuration"
targets = ["check-agent-workflow"]
manual_requirements = []
covers = []

[profiles.workflow_core]
description = "Core build/runner and tool interoperability"
targets = ["validate-workflow"]
manual_requirements = []
covers = ["workflow"]

[profiles.local_rtl]
description = "Local RTL or testbench change"
targets = []
manual_requirements = ["Run the smallest deterministic test that owns the changed behavior."]
covers = []

[profiles.decoder]
description = "Decoder datapath, scheduler, RAM, or K-sign change"
targets = ["test-integration"]
manual_requirements = ["If shared scheduling, geometry, or fixed cycles changed, run affected K=3/K=4 profiles and record the boundaries."]
covers = ["local_rtl"]

[profiles.public_params]
description = "Public parameters or storage geometry"
targets = []
manual_requirements = ["Test the changed parameter levels; use representative endpoints for shared geometry changes. Recompute affected cycle budgets; do not run unrelated algorithm families."]
covers = ["decoder", "local_rtl"]

[profiles.kem]
description = "KEM semantics, serialization, SM3/DRNG, or complete top-level change"
targets = []
manual_requirements = ["Choose the smallest relevant golden/reference test; check affected byte/word, cycle and rejection behavior. No automatic full KEM regression."]
covers = ["local_rtl"]

[profiles.formal]
description = "Formal harness, property, or SymbiYosys task"
targets = []
manual_requirements = ["Report harness boundary, assumptions, parameters, and unreachable states."]
covers = []

[profiles.physical]
description = "XDC or implementation behavior that can affect physical evidence"
targets = []
manual_requirements = ["For FPGA mapping, resource or timing acceptance, or physical baseline updates, run a provenance-complete, same-condition Vivado implementation and create a RUN manifest. For functional-only fixes, complete required functional gates and report physical effects as unverified; do not claim physical benefits or update physical baselines."]
covers = []

[[routing]]
profile = "workflow_core"
exact = ["eda", "scripts/run_validation.py", "scripts/eda-env.sh"]
prefixes = ["workflow-smoke/"]

[[routing]]
profile = "records"
prefixes = ["docs/", "reports/", ".agents/skills/"]
exact = ["README.md", "CLAUDE.md", "AGENTS.md", ".gitignore"]

[[routing]]
profile = "tool_entry"
prefixes = ["filelists/"]
exact = [".rules.verible_lint", "config/rtl_toolchain.lock", "config/local.mk", "config/local.mk.example", "config/vivado_local.tcl.example"]
suffixes = [".tcl", ".vlt"]

[[routing]]
profile = "workflow"
prefixes = ["workflow-smoke/", ".github/workflows/"]
exact = [
  "Makefile",
  "pyproject.toml",
  "uv.lock",
  "config/validation_profiles.toml",
  "config/test_catalog.toml",
  "scripts/test_catalog.py",
  "scripts/check_filelists.py",
  "scripts/check_plan.py",
  "scripts/check_project_records.py",
  "scripts/check_tool_versions.py",
  "scripts/eda-env.sh",
  "scripts/format_sv_decls.py",
  "scripts/report_qor.py",
  "scripts/run_quiet.py",
  "scripts/tool_runner.py",
  "scripts/run_validation.py",
  "scripts/sby_quiet.py",
  "scripts/validation_events.py",
  "scripts/validation_profiles.py",
  "scripts/verilator_quiet.py",
  "tests/test_agent_workflow.py",
]

[[routing]]
profile = "decoder"
exact = [
  "scripts/check_model_rtl.py",
  "scripts/gen_toy_case_fixture.py",
  "scripts/min_sum_model.c",
  "scripts/qc_matrix_data.py",
  "scripts/run_bike_random.py",
  "scripts/run_quantization_experiment.py",
]

[[routing]]
profile = "kem"
exact = [
  "scripts/check_trike_kem_asic_structure.py",
  "scripts/check_trike_sm3_sharing.ys",
  "scripts/gen_trike_decaps_syndrome_fixture.py",
  "scripts/gen_trike_encaps_fixture.py",
  "scripts/gen_trike_inv_schedule.py",
  "scripts/gen_trike_keygen_fixture.py",
  "scripts/gen_trike_minsum_kem_case.py",
  "scripts/gen_trike_poly_inv_fixture.py",
  "scripts/gen_trike_poly_mul_fixture.py",
  "scripts/model_trike_poly_inv_by.py",
  "scripts/run_trike_reference_kat.py",
  "scripts/trike_fixture_utils.py",
]

[[routing]]
profile = "formal"
prefixes = ["formal/"]
exact = ["rtl/k_sign_overlap_scheduler.sv"]

[[routing]]
profile = "local_rtl"
prefixes = ["rtl/", "tb/"]

[[routing]]
