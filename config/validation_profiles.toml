targets = ["check-records"]
covers_profiles = ["tool_entry", "workflow"]

[[owners]]
exact = [".rules.verible_lint"]
targets = ["lint-rtl"]
covers_profiles = ["tool_entry"]

[[owners]]
exact = ["config/rtl_toolchain.lock"]
targets = ["check"]
covers_profiles = ["records", "tool_entry", "local_rtl", "decoder", "formal"]

[[owners]]
exact = ["scripts/run_bike_random.py"]
targets = ["regress"]
covers_profiles = ["decoder"]

[[owners]]
exact = ["scripts/check_model_rtl.py", "scripts/min_sum_model.c"]
targets = ["check-model-rtl-bike128"]
covers_profiles = ["decoder"]

[[owners]]
