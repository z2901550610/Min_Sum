schema_version = 3
profile_order = [
  "records",
  "tool_entry",
  "workflow",
  "local_rtl",
  "decoder",
  "public_params",
  "kem",
  "formal",
  "physical",
]

[profiles.records]
description = "Documentation, experiment records, or Vivado manifests"
targets = ["check-records"]
release_targets = []
iteration_targets = []
manual_requirements = []
covers = []
scope = "纯文档、实验索引或Vivado manifest"
minimum_gate = "`make check-records`"
boundary = "再运行`git diff --check`"

[profiles.tool_entry]
description = "Tool lock, filelist, waiver, Make, or Tcl entrypoint"
targets = ["check-filelists", "check-records", "check-rtl"]
release_targets = []
iteration_targets = []
manual_requirements = []
covers = ["records"]
scope = "工具锁、filelist、waiver、Make/Tcl入口"
minimum_gate = "`make check-filelists check-records check-rtl`"
boundary = "工具锁按owning rule运行`make check`；Tcl改动至少dry-run对应Vivado目标"

[profiles.workflow]
description = "Local or CI workflow, helper script, workflow smoke test, or repository skill"
targets = ["validate-workflow"]
release_targets = []
iteration_targets = ["check-agent-workflow"]
manual_requirements = []
covers = ["records", "tool_entry", "formal", "local_rtl", "decoder"]
scope = "本地工作流、PoC、综合/QoR脚本或仓库Skill"
minimum_gate = "所属定向目标；无owner或核心入口运行`make validate-workflow`"
boundary = "核心工作流改动运行`make validate-workflow`；定向规则完成测试、Skill或功能脚本改动；Yosys结果只标为估计"

[profiles.local_rtl]
description = "Local RTL or testbench change"
targets = ["check-rtl"]
release_targets = []
iteration_targets = []
manual_requirements = ["Run the smallest deterministic test that owns the changed behavior."]
covers = []
scope = "局部RTL/TB修复"
minimum_gate = "最小定向test + `make check-rtl`"
boundary = "接口、参数或共享源受影响时升级至`ci-fast`"

[profiles.decoder]
description = "Decoder datapath, scheduler, RAM, or K-sign change"
targets = ["ci-fast"]
release_targets = ["ci-fast"]
iteration_targets = []
manual_requirements = ["If shared scheduling, geometry, or fixed cycles changed, run affected K=3/K=4 profiles and record the boundaries."]
covers = ["local_rtl"]
scope = "Decoder数据路径、调度、RAM或K-sign"
minimum_gate = "所属定向test + `make check-rtl`；无owner运行`make ci-fast`"
boundary = "叶级定向目标完成后，发布或共享decoder改动运行`make ci-fast`；固定周期、`residual=0`和`exact=1`分开记录"

[profiles.public_params]
description = "Public parameters or storage geometry"
targets = ["ci-smoke"]
release_targets = ["ci-smoke"]
iteration_targets = []
manual_requirements = ["Run every affected public profile and recompute cycle budgets."]
covers = ["decoder", "local_rtl"]
scope = "公开参数、`r/L/K/COLS_PER_TILE`或存储几何"
minimum_gate = "`make ci-smoke`并运行全部受影响profile"
boundary = "发布运行`make ci-smoke`；重算周期；DFR/FLS报告trials、failures和置信界"

[profiles.kem]
description = "KEM semantics, serialization, SM3/DRNG, or complete top-level change"
targets = ["ci-kem-reference"]
release_targets = ["ci-kem-reference"]
iteration_targets = []
manual_requirements = ["Record byte/word golden results, fixed boundaries, and failure paths separately."]
covers = ["local_rtl"]
scope = "KEM密码语义、序列化、SM3/DRNG边界或完整顶层"
minimum_gate = "所属最小reference test + `make check-rtl`；无owner运行`make ci-kem-reference`"
boundary = "定向目标完成后，发布或共享KEM语义改动运行`make ci-kem-reference`；逐byte/word golden、固定start/done边界和失败路径分开报告"

[profiles.formal]
description = "Formal harness, property, or SymbiYosys task"
targets = ["formal-fast"]
release_targets = ["formal-fast"]
iteration_targets = []
manual_requirements = ["Report harness boundary, assumptions, parameters, and unreachable states."]
covers = []
scope = "形式属性或constant-time小控制"
minimum_gate = "所属proof + cover；无owner运行`make formal-fast`"
boundary = "已知harness运行所属proof/cover；发布或共享formal基础设施运行`make formal-fast`；说明assumption、参数和未覆盖状态"

[profiles.physical]
description = "XDC or implementation behavior that can affect physical evidence"
targets = []
release_targets = []
iteration_targets = []
manual_requirements = ["For FPGA mapping, resource or timing acceptance, or physical baseline updates, run a provenance-complete, same-condition Vivado implementation and create a RUN manifest. For functional-only fixes, complete required functional gates and report physical effects as unverified; do not claim physical benefits or update physical baselines."]
covers = []
scope = "涉及FPGA映射、资源、布局或时序的RTL/XDC"
minimum_gate = "所需功能门禁；物理验收或基线更新另须同条件Vivado"
boundary = "仅功能修复标明物理影响未验证，不宣称物理收益或更新基线；Vivado执行须新run manifest，只有routed可比结果可更新基线"

[[routing]]
profile = "records"
prefixes = ["docs/", "reports/"]
exact = ["README.md", "CLAUDE.md", "AGENTS.md", ".gitignore"]

[[routing]]
profile = "tool_entry"
prefixes = ["config/", "filelists/"]
exact = ["Makefile", ".rules.verible_lint"]
