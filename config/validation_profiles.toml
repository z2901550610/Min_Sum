[[owners]]
prefixes = ["docs/experiments/", "reports/vivado/manifests/"]
exact = ["docs/design/vivado_baseline_registry.md"]
targets = ["check-records"]
covers_profiles = ["records"]

[[owners]]
exact = ["config/verilator_waivers.vlt"]
targets = ["lint-verilator"]
covers_profiles = ["tool_entry"]

[[owners]]
exact = ["config/validation_profiles.toml", "scripts/validation_profiles.py", "scripts/check_plan.py"]
targets = ["check-agent-workflow"]
covers_profiles = ["workflow"]

[[owners]]
exact = ["tests/test_agent_workflow.py"]
targets = ["check-agent-workflow"]
covers_profiles = ["workflow"]

[[owners]]
exact = ["pyproject.toml", "uv.lock"]
targets = ["python-sync", "check-agent-workflow"]
covers_profiles = ["workflow"]

[[owners]]
