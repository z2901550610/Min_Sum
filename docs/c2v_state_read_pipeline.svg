<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
  <defs>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .header { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 12px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .col { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .col-alt { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .lane-line { stroke: #e2e8f0; stroke-width: 1; }
      .bar-addr { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 6; }
      .bar-mem { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 6; }
      .bar-reg { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
      .bar-comb { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 6; }
      .bar-note { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.3; rx: 6; }
      .arrow { stroke: #64748b; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrowBlue); }
      .align { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 8 6; }
      .align-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dc2626; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1760" height="780" class="bg"/>
  <text x="900" y="52" text-anchor="middle" class="title">C2V 状态读取甘特图</text>
  <text x="900" y="77" text-anchor="middle" class="subtitle">同一个 lane/edge：各 RAM 输出按不同延迟错开，最终在 C 阶段对齐后进入 CNU B</text>

  <!-- timeline columns -->
  <rect x="260" y="105" width="260" height="610" class="col"/>
  <rect x="520" y="105" width="260" height="610" class="col-alt"/>
  <rect x="780" y="105" width="260" height="610" class="col"/>
  <rect x="1040" y="105" width="260" height="610" class="col-alt"/>
  <rect x="1300" y="105" width="260" height="610" class="col"/>
  <line x1="260" y1="155" x2="1560" y2="155" class="lane-line"/>

  <text x="390" y="133" text-anchor="middle" class="header">R：发起读</text>
  <text x="650" y="133" text-anchor="middle" class="header">R+1 / Q：快路径捕获</text>
  <text x="910" y="133" text-anchor="middle" class="header">R+2 / S：慢路径补齐</text>
  <text x="1170" y="133" text-anchor="middle" class="header">R+3 / C：CNU B 对齐</text>
  <text x="1430" y="133" text-anchor="middle" class="header">R+4 / P：写 tile buffer</text>

  <!-- lane labels and separators -->
  <text x="70" y="195" class="lane">地址 / tag</text>
  <text x="70" y="285" class="lane">syndrome</text>
  <text x="70" y="375" class="lane">ram_accum</text>
  <text x="70" y="465" class="lane">ram_m comp</text>
  <text x="70" y="555" class="lane">ram_s sign</text>
  <text x="70" y="645" class="lane">CNU B / 写回</text>
  <line x1="50" y1="235" x2="1745" y2="235" class="lane-line"/>
  <line x1="50" y1="325" x2="1745" y2="325" class="lane-line"/>
  <line x1="50" y1="415" x2="1745" y2="415" class="lane-line"/>
  <line x1="50" y1="505" x2="1745" y2="505" class="lane-line"/>
  <line x1="50" y1="595" x2="1745" y2="595" class="lane-line"/>

  <!-- R address -->
  <rect x="300" y="170" width="190" height="48" class="bar-addr"/>
  <text x="395" y="190" text-anchor="middle" class="code">c2v_valid_r</text>
  <text x="395" y="208" text-anchor="middle" class="tiny">row_addr / tile_offset / diag_idx_global</text>

  <!-- index pipeline -->
  <rect x="560" y="174" width="125" height="40" class="bar-reg"/>
  <text x="622" y="199" text-anchor="middle" class="code">diag_idx_global_q</text>
  <rect x="820" y="174" width="125" height="40" class="bar-reg"/>
  <text x="882" y="199" text-anchor="middle" class="code">diag_idx_global_s</text>
  <rect x="1080" y="174" width="125" height="40" class="bar-reg"/>
  <text x="1142" y="199" text-anchor="middle" class="code">diag_idx_global_c</text>
  <path d="M490 194 H560" class="arrow"/>
  <path d="M685 194 H820" class="arrow"/>
  <path d="M945 194 H1080" class="arrow"/>

  <!-- syndrome lane -->
  <rect x="305" y="260" width="150" height="48" class="bar-mem"/>
  <text x="380" y="280" text-anchor="middle" class="code">ram_syndrome</text>
  <text x="380" y="298" text-anchor="middle" class="tiny">组合读 s[row]</text>
  <rect x="560" y="264" width="145" height="40" class="bar-reg"/>
  <text x="632" y="288" text-anchor="middle" class="code">syndrome_q</text>
  <rect x="820" y="264" width="145" height="40" class="bar-reg"/>
  <text x="892" y="288" text-anchor="middle" class="code">syndrome_s</text>
  <rect x="1080" y="264" width="145" height="40" class="bar-reg"/>
  <text x="1152" y="288" text-anchor="middle" class="code">syndrome_c</text>
  <path d="M455 284 H560" class="arrow-blue"/>
  <path d="M705 284 H820" class="arrow"/>
  <path d="M965 284 H1080" class="arrow"/>
  <text x="462" y="274" class="tiny">0-cycle, Q 捕获</text>

  <!-- accum lane -->
  <rect x="305" y="350" width="150" height="48" class="bar-mem"/>
  <text x="380" y="370" text-anchor="middle" class="code">ram_accum</text>
  <text x="380" y="388" text-anchor="middle" class="tiny">组合读 old raw_sum</text>
  <rect x="560" y="354" width="145" height="40" class="bar-reg"/>
  <text x="632" y="378" text-anchor="middle" class="code">accum_q</text>
  <rect x="820" y="354" width="145" height="40" class="bar-reg"/>
  <text x="892" y="378" text-anchor="middle" class="code">accum_s</text>
  <rect x="1080" y="354" width="145" height="40" class="bar-reg"/>
  <text x="1152" y="378" text-anchor="middle" class="code">accum_c</text>
  <path d="M455 374 H560" class="arrow-blue"/>
  <path d="M705 374 H820" class="arrow"/>
  <path d="M965 374 H1080" class="arrow"/>
  <path d="M1225 374 C1325 374 1335 664 1430 664" class="arrow"/>
  <text x="462" y="364" class="tiny">0-cycle, Q 捕获</text>

  <!-- comp lane -->
  <rect x="305" y="440" width="150" height="48" class="bar-mem"/>
  <text x="380" y="460" text-anchor="middle" class="code">ram_m</text>
  <text x="380" y="478" text-anchor="middle" class="tiny">同步读 comp</text>
  <rect x="560" y="444" width="145" height="40" class="bar-mem"/>
  <text x="632" y="468" text-anchor="middle" class="code">rdata/valid</text>
  <rect x="820" y="444" width="145" height="40" class="bar-reg"/>
  <text x="892" y="468" text-anchor="middle" class="code">c2v_comp_s</text>
  <rect x="1080" y="444" width="145" height="40" class="bar-reg"/>
  <text x="1152" y="468" text-anchor="middle" class="code">comp_c</text>
  <path d="M455 464 H560" class="arrow-blue"/>
  <path d="M705 464 H820" class="arrow"/>
  <path d="M965 464 H1080" class="arrow"/>
  <text x="468" y="454" class="tiny">BRAM read</text>

  <!-- sign lane -->
  <rect x="305" y="530" width="150" height="48" class="bar-mem"/>
  <text x="380" y="550" text-anchor="middle" class="code">ram_s</text>
  <text x="380" y="568" text-anchor="middle" class="tiny">同步读 sign frame</text>
  <rect x="585" y="534" width="160" height="40" class="bar-mem"/>
  <text x="665" y="558" text-anchor="middle" class="code">frame_q / rbit_q</text>
  <rect x="820" y="534" width="145" height="40" class="bar-mem"/>
  <text x="892" y="558" text-anchor="middle" class="code">lane_sign_q</text>
  <rect x="1080" y="534" width="145" height="40" class="bar-reg"/>
  <text x="1152" y="558" text-anchor="middle" class="code">c2v_sign_c</text>
  <path d="M455 554 H585" class="arrow-blue"/>
  <path d="M745 554 H820" class="arrow"/>
  <path d="M965 554 H1080" class="arrow"/>

  <!-- alignment line -->
  <line x1="1255" y1="160" x2="1255" y2="585" class="align"/>
  <text x="1270" y="245" class="align-label">CNU B 对齐线</text>
  <text x="1270" y="264" class="tiny">syndrome_c / accum_c</text>
  <text x="1270" y="282" class="tiny">comp_c / sign_c / diag_idx_global_c</text>
  <path d="M1225 194 H1255" class="arrow"/>
  <path d="M1225 284 H1255" class="arrow"/>
  <path d="M1225 464 H1255" class="arrow"/>
  <path d="M1225 554 H1255" class="arrow"/>

  <!-- CNU/write lane -->
  <rect x="1310" y="620" width="155" height="50" class="bar-comb"/>
  <text x="1387" y="640" text-anchor="middle" class="code">CNU B</text>
  <text x="1387" y="658" text-anchor="middle" class="tiny">重建 C2V msg</text>
  <path d="M1255 554 C1265 590 1280 620 1310 642" class="arrow"/>
  <rect x="1510" y="620" width="145" height="50" class="bar-comb"/>
  <text x="1582" y="640" text-anchor="middle" class="code">signmag_to_tc</text>
  <text x="1582" y="658" text-anchor="middle" class="tiny">raw_edge</text>
  <path d="M1465 645 H1510" class="arrow"/>

  <rect x="1430" y="690" width="225" height="55" class="bar-mem"/>
  <text x="1542" y="710" text-anchor="middle" class="code">ram_accum / ram_t</text>
  <text x="1542" y="728" text-anchor="middle" class="tiny">new raw_sum / raw_edge 写入</text>
  <path d="M1582 670 V690" class="arrow"/>

  <rect x="1320" y="735" width="210" height="38" class="bar-note"/>
  <text x="1425" y="752" text-anchor="middle" class="tiny">Q_BASE&gt;1 时经 P 写入</text>
  <text x="1425" y="770" text-anchor="middle" class="tiny">Q_BASE=1 时可由 C 直写</text>
</svg>
