<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760">
<defs><style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.hdr{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.lane{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.tiny{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.code{font:16px "SFMono-Regular",Consolas,monospace;fill:#0f172a}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker></defs>
<rect x="20" y="20" width="1660" height="720" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="850" y="55.0" text-anchor="middle" class="title">
<tspan x="850" dy="0">固定窗口调度流水</tspan>
</text>
<text x="850" y="82.0" text-anchor="middle" class="sub">
<tspan x="850" dy="0">每个 tile 窗口内部固定扫描 diag_idx_local × lane_group_idx；窗口边界推进 C2V/V2C tile，形成 prime/overlap/drain</tspan>
</text>
<rect x="120" y="160" width="230" height="70" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="235.0" y="191.0" text-anchor="middle" class="tiny">
<tspan x="235.0" dy="0">ITER_CLEAR</tspan>
<tspan x="235.0" dy="18">clear ram_m</tspan>
</text>
<rect x="370" y="160" width="240" height="70" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="490.0" y="191.0" text-anchor="middle" class="code">
<tspan x="490.0" dy="0">C2V_PRIME</tspan>
<tspan x="490.0" dy="18">fill first tile</tspan>
</text>
<rect x="640" y="160" width="430" height="70" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="855.0" y="191.0" text-anchor="middle" class="code">
<tspan x="855.0" dy="0">OVERLAP</tspan>
<tspan x="855.0" dy="18">C2V tile k+1 / V2C tile k</tspan>
</text>
<rect x="1100" y="160" width="260" height="70" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="1230.0" y="191.0" text-anchor="middle" class="code">
<tspan x="1230.0" dy="0">V2C_DRAIN</tspan>
<tspan x="1230.0" dy="18">drain last tile</tspan>
</text>
<rect x="1390" y="160" width="180" height="70" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="1480.0" y="200.0" text-anchor="middle" class="tiny">
<tspan x="1480.0" dy="0">DONE / next iter</tspan>
</text>
<line x1="350" y1="195" x2="370" y2="195" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<line x1="610" y1="195" x2="640" y2="195" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<line x1="1070" y1="195" x2="1100" y2="195" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<line x1="1360" y1="195" x2="1390" y2="195" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="220" y="330" width="1260" height="330" rx="0" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="850" y="360.0" text-anchor="middle" class="hdr">
<tspan x="850" dy="0">单个 tile/window 内部扫描顺序</tspan>
</text>
<rect x="300" y="410" width="160" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="380.0" y="441.0" text-anchor="middle" class="code">
<tspan x="380.0" dy="0">diag=0</tspan>
<tspan x="380.0" dy="18">q=0..Q_TILE-1</tspan>
</text>
<rect x="520" y="410" width="160" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="600.0" y="441.0" text-anchor="middle" class="code">
<tspan x="600.0" dy="0">diag=1</tspan>
<tspan x="600.0" dy="18">q=0..Q_TILE-1</tspan>
</text>
<rect x="740" y="410" width="160" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="820.0" y="441.0" text-anchor="middle" class="code">
<tspan x="820.0" dy="0">diag=2</tspan>
<tspan x="820.0" dy="18">q=0..Q_TILE-1</tspan>
</text>
<rect x="960" y="410" width="160" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1040.0" y="450.0" text-anchor="middle" class="code">
<tspan x="1040.0" dy="0">...</tspan>
</text>
<rect x="1180" y="410" width="160" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1260.0" y="441.0" text-anchor="middle" class="code">
<tspan x="1260.0" dy="0">diag=W-1</tspan>
<tspan x="1260.0" dy="18">q=0..Q_TILE-1</tspan>
</text>
<line x1="460" y1="445" x2="520" y2="445" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<line x1="680" y1="445" x2="740" y2="445" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<line x1="900" y1="445" x2="960" y2="445" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<line x1="1120" y1="445" x2="1180" y2="445" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<rect x="360" y="550" width="300" height="55" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="510.0" y="573.5" text-anchor="middle" class="tiny">
<tspan x="510.0" dy="0">last_lane_group_idx: lane_group_idx clears</tspan>
<tspan x="510.0" dy="18">else diag_idx_local++</tspan>
</text>
<rect x="800" y="550" width="360" height="55" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="980.0" y="573.5" text-anchor="middle" class="tiny">
<tspan x="980.0" dy="0">last_diag_idx &amp;&amp; last_lane_group_idx</tspan>
<tspan x="980.0" dy="18">advance tile/window_idx</tspan>
</text>
<rect x="1190" y="550" width="220" height="55" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="1300.0" y="573.5" text-anchor="middle" class="tiny">
<tspan x="1300.0" dy="0">fill_buf=window_idx[0]</tspan>
<tspan x="1300.0" dy="18">active_buf=~window_idx[0]</tspan>
</text>
<line x1="1240" y1="480" x2="1300" y2="550" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
</svg>
